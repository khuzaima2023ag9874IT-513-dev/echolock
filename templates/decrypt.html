<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoLock - Decrypt</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <style>
        body { 
            background: #f8f9fa; 
            padding-top: 30px; 
        }

        h1 {
            font-size: 1.8rem;
        }

        .card {
            border-radius: 12px;
        }

        /* 📱 Tablet & Mobile */
        @media (max-width: 768px) {

            body {
                padding-top: 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .card {
                margin: 0 10px;
            }

            .btn {
                width: 100%;
            }

            .d-flex {
                flex-direction: column !important;
                align-items: stretch !important;
            }

            .d-flex .btn {
                margin-bottom: 10px;
            }
        }

        /* 📱 Small Mobile */
        @media (max-width: 480px) {

            .container {
                padding-left: 10px;
                padding-right: 10px;
            }

            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="text-center mb-3">🔓 EchoLock - Decrypt File</h1>
    <p class="text-center text-muted px-2">
        Decrypt only if you are inside the authorized location
    </p>

    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-body">

            <div class="mb-3">
                <label class="form-label fw-bold">Select Encrypted File (.echolock)</label>
                <input type="file" id="encryptedFile" accept=".echolock" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password">
            </div>

            <button onclick="startDecryption()" class="btn btn-primary w-100">
                Decrypt File Now
            </button>

        </div>
    </div>

    <div id="status" class="mt-4"></div>

    <!-- Responsive Navigation -->
    <div class="text-center mt-4 d-flex justify-content-center flex-wrap">
        <a href="/" class="btn btn-outline-secondary m-1">Back to Encrypt</a>
        <a href="/logs" class="btn btn-outline-info m-1">📊 View Logs</a>
        <a href="/logout" class="btn btn-outline-danger m-1">🚪 Logout</a>
    </div>

</div>

<script>

// 📍 Distance function
function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;

    const a = Math.sin(Δφ/2)**2 +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2)**2;

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

// 🚀 Start decryption
function startDecryption() {

    const status = document.getElementById('status');

    status.innerHTML = `
        <div class="alert alert-info">
            📍 Please allow location access...
        </div>
    `;

    navigator.geolocation.getCurrentPosition(
        (position) => {
            decryptFile(position.coords.latitude, position.coords.longitude);
        },
        () => {
            status.innerHTML = `
                <div class="alert alert-danger">
                    ⚠️ Location permission required for decryption.
                </div>
            `;
        }
    );
}

// 🔓 Decrypt
function decryptFile(currentLat, currentLng) {

    const fileInput = document.getElementById('encryptedFile');
    const password = document.getElementById('password').value.trim();
    const status = document.getElementById('status');

    if (!fileInput.files.length || !password) {
        status.innerHTML = `<div class="alert alert-danger">Select file and enter password.</div>`;
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        try {
            const data = JSON.parse(e.target.result);
            const metadata = data.metadata;
            const ciphertext = data.ciphertext;

            // 📍 Distance check
            const distance = haversine(
                currentLat,
                currentLng,
                metadata.target_lat,
                metadata.target_long
            );

            const isInside = distance <= metadata.radius;

            // 📊 Log attempt
            fetch('/log_decrypt', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    action: 'decrypt_attempt',
                    status: isInside ? 'success' : 'failed',
                    location_info: `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`,
                    details: `Distance: ${Math.round(distance)}m`
                })
            });

            if (!isInside) {
                status.innerHTML = `
                    <div class="alert alert-danger">
                        ❌ Access Denied!<br>
                        You are ${Math.round(distance)} meters away.
                    </div>
                `;
                return;
            }

            // ✅ Location matched
            status.innerHTML = `
                <div class="alert alert-success">
                    ✅ Location verified (${Math.round(distance)}m). Decrypting...
                </div>
            `;

            // 🔑 SAME locationFactor as encryption
            const locationFactor = CryptoJS.SHA256(
                `${metadata.target_lat},${metadata.target_long},${metadata.radius}`
            ).toString();

            const salt = CryptoJS.enc.Hex.parse(metadata.salt);
            const iv = CryptoJS.enc.Hex.parse(metadata.iv);

            const key = CryptoJS.PBKDF2(password + locationFactor, salt, {
                keySize: 256/32,
                iterations: 10000
            });

            const decrypted = CryptoJS.AES.decrypt(ciphertext, key, { iv: iv });

            // ❗ Validate decryption
            const decryptedBase64 = decrypted.toString(CryptoJS.enc.Base64);

            if (!decryptedBase64) {
                throw new Error("Wrong password or corrupted file");
            }

            const binaryString = atob(decryptedBase64);
            const bytes = new Uint8Array(binaryString.length);

            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            const blob = new Blob([bytes]);
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = metadata.filename;
            a.click();

            status.innerHTML = `
                <div class="alert alert-success">
                    🎉 Decryption Successful!<br>
                    File "<strong>${metadata.filename}</strong>" downloaded.
                </div>
            `;

        } catch (err) {
            status.innerHTML = `
                <div class="alert alert-danger">
                    ❌ Invalid file or wrong password.
                </div>
            `;
        }
    };

    reader.readAsText(fileInput.files[0]);
}

</script>

</body>
</html>
